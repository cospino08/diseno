<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscar disponibilidad · Clínica San Rafael</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/componentes.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>

  <header class="encabezado">
    <div class="contenedor encabezado__barra">
      <a class="marca" href="index.html"><span class="marca__icono" aria-hidden="true">✚</span> Clínica San Rafael</a>
      <button class="boton boton--secundario menu__boton" type="button"
              aria-expanded="false" aria-controls="menu-principal">Menú</button>
      <nav class="menu" aria-label="Principal">
        <ul class="menu__lista" id="menu-principal" data-abierto="false">
          <li><a class="menu__enlace" href="index.html">Inicio</a></li>
          <li><a class="menu__enlace" href="buscar.html">Reservar cita</a></li>
          <li><a class="menu__enlace" href="mis-citas.html">Mis citas</a></li>
          <li><a class="menu__enlace" href="perfil.html">Mi perfil</a></li>
          <li class="menu__usuario">
            <span data-usuario></span>
            <button class="boton boton--enlace" type="button" data-accion="cerrar-sesion">Cerrar sesión</button>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- P-02. Pasos 2 (buscar) y 3 (elegir hora) de la reserva. -->
  <main id="contenido" class="contenedor" tabindex="-1">
    <h1>Buscar disponibilidad</h1>

    <!-- Aviso al volver de P-03 por un conflicto (FRANJA_OCUPADA y similares). -->
    <div id="zona-aviso"></div>

    <form id="form-buscar" class="formulario" novalidate>
      <div class="campo">
        <label for="especialidad">Especialidad <span class="campo__requerido" aria-hidden="true">*</span></label>
        <select class="control" id="especialidad" name="especialidad" required aria-describedby="especialidad-error">
          <option value="">Cargando especialidades…</option>
        </select>
        <p id="especialidad-error" class="campo__error" hidden></p>
      </div>
      <div class="campo">
        <label for="profesional">Profesional (opcional)</label>
        <select class="control" id="profesional" name="profesional">
          <option value="">Cualquier profesional</option>
        </select>
      </div>
      <div class="campo">
        <label for="fecha">Fecha <span class="campo__requerido" aria-hidden="true">*</span></label>
        <input class="control" id="fecha" name="fecha" type="date" required aria-describedby="fecha-error">
        <p id="fecha-error" class="campo__error" hidden></p>
      </div>
      <button class="boton boton--primario boton--bloque" type="submit">Buscar</button>
    </form>

    <section aria-labelledby="titulo-resultados">
      <!-- aria-live: el lector de pantalla anuncia cuántas horas encontró. -->
      <h2 id="titulo-resultados" aria-live="polite" tabindex="-1">Elige una especialidad y una fecha</h2>
      <div id="resultados"></div>
      <div class="acciones" id="navegar-dias" hidden>
        <button class="boton boton--secundario" type="button" id="dia-anterior">◂ Día anterior</button>
        <button class="boton boton--secundario" type="button" id="dia-siguiente">Día siguiente ▸</button>
      </div>
    </section>
  </main>

  <footer class="pie">
    <div class="contenedor">
      <p>Proyecto académico de Análisis y Diseño de Software. Clínica ficticia: no ingreses datos reales.</p>
    </div>
  </footer>

  <script type="module">
    // La pantalla NO calcula la disponibilidad: la RLS le oculta las citas de
    // otros pacientes. La calcula la RPC franjas_disponibles en la base (plan P8)
    // y devuelve solo franjas activas, futuras y sin cita activa.
    import { protegerPagina, manejarSesionExpirada } from '../assets/js/auth.js';
    import { listarEspecialidades, listarProfesionales } from '../assets/js/datos/catalogos.js';
    import { franjasDisponibles } from '../assets/js/datos/citas.js';
    import { MENSAJES } from '../assets/js/ui/mensajes.js';
    import { mostrarCargando, mostrarVacio, mostrarError, limpiar, crearAlerta } from '../assets/js/ui/estados.js';
    import { formatearFecha, formatearHora, hoyEnBogota, sumarDias } from '../assets/js/ui/formato.js';
    import { validarFormulario, requerido, validarFechaFutura } from '../assets/js/validacion.js';
    import { urlBuscar } from './comun.js';

    const formulario = document.getElementById('form-buscar');
    const selEspecialidad = formulario.elements.especialidad;
    const selProfesional = formulario.elements.profesional;
    const campoFecha = formulario.elements.fecha;
    const titulo = document.getElementById('titulo-resultados');
    const resultados = document.getElementById('resultados');
    const navegarDias = document.getElementById('navegar-dias');
    const botonAnterior = document.getElementById('dia-anterior');

    const reglas = {
      especialidad: requerido('Elige una especialidad.'),
      fecha: validarFechaFutura,
    };

    // Avisos que puede traer ?aviso= desde la confirmación (P-03).
    const AVISOS_PERMITIDOS = ['FRANJA_OCUPADA', 'FRANJA_PASADA', 'FRANJA_NO_EXISTE'];

    const acceso = await protegerPagina({ roles: ['paciente'] });
    if (acceso) await iniciar();

    async function iniciar() {
      const parametros = new URLSearchParams(location.search);
      const hoy = hoyEnBogota();
      campoFecha.min = hoy;
      campoFecha.value = parametros.get('fecha') && parametros.get('fecha') >= hoy ? parametros.get('fecha') : hoy;

      mostrarAvisoDeConflicto(parametros.get('aviso'));

      const cargadas = await cargarEspecialidades(parametros.get('especialidad'));
      if (!cargadas) return;
      if (selEspecialidad.value) {
        await cargarProfesionales(parametros.get('profesional'));
        await buscar(); // se vuelve de P-03 o se recargó: se repite la búsqueda
      }

      selEspecialidad.addEventListener('change', () => cargarProfesionales(null));
      formulario.addEventListener('submit', (evento) => {
        evento.preventDefault();
        if (validarFormulario(formulario, reglas)) buscar();
      });
      botonAnterior.addEventListener('click', () => moverDia(-1));
      document.getElementById('dia-siguiente').addEventListener('click', () => moverDia(1));
    }

    /**
     * Si se llegó aquí por un conflicto al reservar, se explica qué pasó. La lista
     * de abajo ya es la disponibilidad recargada. Solo se aceptan códigos
     * conocidos: el texto sale de mensajes.js, nunca de la URL.
     */
    function mostrarAvisoDeConflicto(codigo) {
      if (!AVISOS_PERMITIDOS.includes(codigo)) return;
      const zona = document.getElementById('zona-aviso');
      zona.append(crearAlerta('aviso', MENSAJES[codigo], 'La hora que elegiste ya no está disponible'));
      // Se quita ?aviso= para que no reaparezca al recargar la página.
      const url = new URL(location.href);
      url.searchParams.delete('aviso');
      history.replaceState(null, '', url);
    }

    async function cargarEspecialidades(seleccionada) {
      const { data, error } = await listarEspecialidades();
      if (error) {
        if (manejarSesionExpirada(error)) return false;
        selEspecialidad.replaceChildren(crearOpcion('', 'No se pudieron cargar'));
        mostrarError(resultados, error, { reintentar: () => location.reload() });
        return false;
      }
      selEspecialidad.replaceChildren(
        crearOpcion('', 'Elige una especialidad'),
        ...data.map((especialidad) => crearOpcion(especialidad.id, especialidad.nombre)),
      );
      if (seleccionada && data.some((e) => String(e.id) === seleccionada)) selEspecialidad.value = seleccionada;
      return true;
    }

    /** Llena "Profesional" con los de la especialidad elegida (solo activos). */
    async function cargarProfesionales(seleccionado) {
      selProfesional.replaceChildren(crearOpcion('', 'Cualquier profesional'));
      if (!selEspecialidad.value) return;
      const { data, error } = await listarProfesionales({ especialidad: Number(selEspecialidad.value) });
      if (error) {
        manejarSesionExpirada(error);
        return; // el filtro es opcional: se puede buscar con "Cualquier profesional"
      }
      selProfesional.append(...data.map((p) => crearOpcion(p.id, p.nombre_publico)));
      if (seleccionado && data.some((p) => String(p.id) === seleccionado)) selProfesional.value = seleccionado;
    }

    function crearOpcion(valor, texto) {
      const opcion = document.createElement('option');
      opcion.value = String(valor);
      opcion.textContent = texto; // nombres de la base: siempre como texto
      return opcion;
    }

    function filtrosActuales() {
      return {
        especialidad: selEspecialidad.value,
        profesional: selProfesional.value,
        fecha: campoFecha.value,
      };
    }

    async function buscar() {
      const filtros = filtrosActuales();
      // La búsqueda queda en la URL: así funcionan "Atrás", la recarga y el
      // regreso desde P-03 después de un conflicto.
      history.replaceState(null, '', urlBuscar(filtros));

      titulo.textContent = 'Buscando…';
      mostrarCargando(resultados, 'Buscando horas disponibles…');
      navegarDias.hidden = true;

      const { data, error } = await franjasDisponibles({
        especialidad: Number(filtros.especialidad),
        profesional: filtros.profesional ? Number(filtros.profesional) : null,
        fecha: filtros.fecha,
      });
      if (error) {
        if (manejarSesionExpirada(error)) return;
        titulo.textContent = 'No pudimos buscar';
        return mostrarError(resultados, error, { reintentar: buscar });
      }

      navegarDias.hidden = false;
      botonAnterior.disabled = filtros.fecha <= hoyEnBogota();
      const fechaLegible = formatearFecha(filtros.fecha);

      if (data.length === 0) {
        titulo.textContent = `Sin horas disponibles el ${fechaLegible}`;
        return mostrarVacio(resultados, 'No hay horas disponibles para esa fecha.', {
          texto: 'Ver el día siguiente',
          // Este botón desaparece al buscar: el foco pasa al título de resultados
          // para que el usuario de teclado no quede "perdido" al inicio de la página.
          alPulsar: () => moverDia(1, { enfocar: true }),
        });
      }

      titulo.textContent = data.length === 1
        ? `1 hora disponible el ${fechaLegible}`
        : `${data.length} horas disponibles el ${fechaLegible}`;
      limpiar(resultados);
      resultados.append(crearListaPorProfesional(data, filtros));
    }

    /** Agrupa las franjas por profesional (la RPC ya las devuelve ordenadas por hora). */
    function crearListaPorProfesional(franjas, filtros) {
      const grupos = new Map();
      for (const franja of franjas) {
        if (!grupos.has(franja.professional_id)) grupos.set(franja.professional_id, []);
        grupos.get(franja.professional_id).push(franja);
      }

      const lista = document.createElement('ul');
      lista.className = 'lista-tarjetas';
      for (const franjasProfesional of grupos.values()) {
        const { profesional, especialidad } = franjasProfesional[0];
        const item = document.createElement('li');
        item.className = 'tarjeta';

        const nombre = document.createElement('h3');
        nombre.className = 'tarjeta__titulo';
        nombre.textContent = profesional;
        const meta = document.createElement('p');
        meta.className = 'tarjeta__meta';
        meta.textContent = especialidad;

        const horas = document.createElement('ul');
        horas.className = 'franjas';
        for (const franja of franjasProfesional) {
          const hora = formatearHora(franja.hora_inicio);
          const boton = document.createElement('button');
          boton.type = 'button';
          boton.className = 'franja';
          boton.textContent = hora;
          // El lector de pantalla oye "Reservar 08:30 con Dra. …", no solo "08:30".
          boton.setAttribute('aria-label', `Reservar ${hora} con ${profesional}`);
          boton.addEventListener('click', () => irAConfirmar(franja, filtros));
          const li = document.createElement('li');
          li.append(boton);
          horas.append(li);
        }

        item.append(nombre, meta, horas);
        lista.append(item);
      }
      return lista;
    }

    /**
     * Paso 3: ir a la confirmación. Solo se pasa el id de la franja y los filtros;
     * P-03 vuelve a pedir los datos a la base en vez de confiar en la URL.
     */
    function irAConfirmar(franja, filtros) {
      const parametros = new URLSearchParams({ franja: franja.schedule_id, fecha: franja.fecha });
      parametros.set('especialidad', filtros.especialidad);
      if (filtros.profesional) parametros.set('profesional', filtros.profesional);
      location.assign(`reservar.html?${parametros}`);
    }

    async function moverDia(dias, { enfocar = false } = {}) {
      const nueva = sumarDias(campoFecha.value || hoyEnBogota(), dias);
      if (nueva < hoyEnBogota()) return;
      campoFecha.value = nueva;
      if (!validarFormulario(formulario, reglas)) return;
      await buscar();
      if (enfocar) titulo.focus();
    }
  </script>
</body>
</html>
